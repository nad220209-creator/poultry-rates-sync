name: Poultry Scraper (Agbro Primary + Poultry Baba Fallback)

on:
  schedule:
    - cron: '0 6 * * *'   # 11:00 AM PKT
    - cron: '0 8 * * *'   # 1:00 PM (13:00) PKT
    - cron: '0 12 * * *'  # 5:00 PM (17:00) PKT
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Libraries & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib playwright pypdf
          playwright install chromium
      - name: Run Scraper
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scraper.py
      - name: Save to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto sync rates: Agbro primary / Poultry Baba fallback" || exit 0
          git push
